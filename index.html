<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Run/Walk Interval Trainer</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Run/Walk">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="header-top">
                <h1>Run/Walk Trainer</h1>
                <div id="auth-section" class="auth-section">
                    <!-- Signed-out state -->
                    <button id="btn-sign-in" class="auth-btn">
                        <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                        Sign In
                    </button>
                    <!-- Signed-in state (hidden initially) -->
                    <div id="user-info" class="user-info" style="display: none;">
                        <img id="user-avatar" class="user-avatar" src="" alt="" referrerpolicy="no-referrer">
                        <span id="user-name" class="user-name"></span>
                        <button id="btn-sign-out" class="auth-btn-small">Sign Out</button>
                    </div>
                </div>
            </div>
            <div id="sync-status" class="sync-status" style="display: none;">
                <span class="sync-dot"></span>
                <span id="sync-text">Synced</span>
            </div>
            <nav>
                <button class="nav-btn active" data-view="workout">Workout</button>
                <button class="nav-btn" data-view="history">History</button>
            </nav>
        </header>

        <!-- Workout View -->
        <div id="workout-view" class="view active">
            <div class="timer-ring-container">
                <svg class="timer-ring" viewBox="0 0 200 200">
                    <circle class="timer-ring-bg" cx="100" cy="100" r="90" />
                    <circle class="timer-ring-progress" cx="100" cy="100" r="90" />
                </svg>
                <div class="timer-center">
                    <div class="phase-label" id="phase-label">READY</div>
                    <div class="timer-display" id="timer-display">30:00</div>
                    <div class="phase-timer" id="phase-timer"></div>
                </div>
            </div>

            <div class="workout-info">
                <div class="info-card">
                    <span class="info-label">Elapsed</span>
                    <span class="info-value" id="elapsed-time">00:00</span>
                </div>
                <div class="info-card">
                    <span class="info-label">Remaining</span>
                    <span class="info-value" id="remaining-time">30:00</span>
                </div>
                <div class="info-card">
                    <span class="info-label">Phase</span>
                    <span class="info-value" id="current-phase">--</span>
                </div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-segments" id="progress-segments"></div>
                <div class="progress-marker" id="progress-marker"></div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" id="btn-start">START</button>
                <button class="ctrl-btn" id="btn-pause" disabled>PAUSE</button>
                <button class="ctrl-btn danger" id="btn-stop" disabled>STOP</button>
            </div>

            <div class="skip-controls" id="skip-controls" style="display: none;">
                <button class="skip-btn" id="btn-prev" title="Restart phase / previous phase">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" transform="scale(-1,1) translate(-24,0)"/></svg>
                    BACK
                </button>
                <button class="skip-btn" id="btn-next" title="Skip to next phase">
                    NEXT
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" transform="translate(0,0)"/></svg>
                </button>
            </div>

            <div class="voice-settings">
                <div class="voice-row">
                    <label for="volume-slider">Volume</label>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.8">
                    <button id="btn-test-voice" class="test-btn">Test</button>
                </div>
            </div>
        </div>

        <!-- History View -->
        <div id="history-view" class="view">
            <div class="history-header">
                <h2>Workout History</h2>
                <button class="clear-btn" id="btn-clear-history">Clear All</button>
            </div>
            <div class="stats-summary" id="stats-summary" style="display: none;"></div>
            <div class="history-list" id="history-list">
                <p class="empty-msg">No workouts yet. Start your first session!</p>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
